name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint 스크립트를 추가한 후 활성화
      # - name: Lint
      #   run: npm run lint

      # test 스크립트를 추가한 후 활성화
      # - name: Test
      #   run: npm test

      - name: Build
        run: npm run build

      - name: Validate Docker build
        run: docker build -t focal-frontend:ci .