name: FE CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fe-production
  cancel-in-progress: true

jobs:
  # PR과 main push에서 프론트엔드 빌드 검증
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json에 lint/test 스크립트를 추가한 후 활성화
      # - name: Lint
      #   run: npm run lint
      #
      # - name: Test
      #   run: npm test

      - name: Build
        run: npm run build

  # main 브랜치에서만 Docker Hub 이미지 생성
  docker:
    name: Build and push Docker image
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/focal-fe:latest
            ${{ secrets.DOCKER_USERNAME }}/focal-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이미지 push가 성공한 경우에만 서버 재배포
  deploy:
    name: Deploy to server
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e

            echo "$DOCKER_TOKEN" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            cd ~/FOCAL

            docker compose pull frontend
            docker compose up -d \
              --no-deps \
              --force-recreate \
              frontend

            docker compose ps frontend
            docker logout