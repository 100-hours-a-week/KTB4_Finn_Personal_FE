<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>새 기록 — FOCAL</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/editor.css" />
  </head>
  <body class="editor-page">
    <header class="topbar"><div class="topbar-inner container-inner"><a class="brand" href="index.html">FOCAL<span class="brand-dot">.</span></a><div class="header-actions"><a href="profile-edit.html"><img class="avatar" src="../assets/image.png" alt="정지호 프로필" /></a></div></div></header>
    <main class="editor-shell container-inner">
      <a class="back-link" href="index.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>피드로 돌아가기</a>
      <section class="editor-card">
        <h1 class="page-heading">새 기록</h1><p class="lead">오늘 시선이 머문 장면을 사진과 함께 남겨보세요.</p>
        <form class="editor-form" action="#" method="post">
          <div class="field"><label for="create-title">제목</label><input id="create-title" name="title" type="text" maxlength="26" placeholder="장면을 한 문장으로 소개해주세요" required /></div>
          <div class="field"><label for="create-tags">태그</label><input id="create-tags" name="tags" type="text" placeholder="예: 풍경, 노을, 오늘의빛" /><p class="helper">쉼표로 구분해 최대 5개까지 입력할 수 있어요.</p></div>
          <div class="field"><label for="create-description">설명</label><textarea id="create-description" name="description" placeholder="이 장면에 담긴 순간을 들려주세요" required></textarea></div>
          <div class="field"><span class="field-label">사진</span><label class="upload-box" for="create-photo"><span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16l4-4 4 4 3-3 5 5"/><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg><strong>사진을 선택하거나 이곳에 놓아주세요</strong><span>JPG, PNG · 최대 10MB</span></span></label><input class="sr-only" id="create-photo" name="photo" type="file" accept="image/jpeg,image/png" required /></div>
          <div class="form-actions"><a class="button outline" href="index.html">취소</a><button class="button" type="submit">기록 올리기</button></div>
        </form>
      </section>
    </main>
  </body>
</html>
