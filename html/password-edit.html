<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 변경 — FOCAL</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/settings.css" />
  </head>
  <body class="settings-page">
    <header class="topbar"><div class="topbar-inner container-inner"><a class="brand" href="index.html">FOCAL<span class="brand-dot">.</span></a><div class="header-actions"><a class="button" href="post-create.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>기록 올리기</span></a><a href="profile-edit.html"><img class="avatar" src="../assets/image.png" alt="정지호 프로필" /></a></div></div></header>
    <main class="settings-shell container-inner">
      <a class="back-link" href="index.html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>피드로 돌아가기</a>
      <section class="settings-card">
        <nav class="settings-tabs" aria-label="계정 설정"><a href="profile-edit.html">프로필</a><a class="active" href="password-edit.html">비밀번호</a></nav>
        <h1 class="page-heading">비밀번호 변경</h1><p class="lead">안전한 계정 사용을 위해 새로운 비밀번호를 설정하세요.</p>
        <form class="settings-form" action="#" method="post">
          <div class="field"><label for="current-password">현재 비밀번호</label><input id="current-password" name="current-password" type="password" placeholder="현재 비밀번호를 입력하세요" autocomplete="current-password" required /></div>
          <div class="field"><label for="new-password">새 비밀번호</label><input id="new-password" name="new-password" type="password" placeholder="8자 이상 입력하세요" autocomplete="new-password" required /><p class="helper">영문, 숫자를 조합해 8자 이상 입력해주세요.</p></div>
          <div class="field"><label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="new-password-confirm" type="password" placeholder="새 비밀번호를 다시 입력하세요" autocomplete="new-password" required /></div>
          <div class="settings-actions"><button class="button wide" type="submit">비밀번호 변경</button></div>
        </form>
      </section>
    </main>
  </body>
</html>
