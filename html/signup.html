<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 — FOCAL</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-page">
    <header class="topbar"><div class="topbar-inner container-inner"><a class="brand" href="index.html">FOCAL<span class="brand-dot">.</span></a></div></header>
    <main class="auth-shell container-inner">
      <section class="auth-card" aria-labelledby="signup-title">
        <h1 id="signup-title">새로운 장면을 시작해요</h1>
        <p class="lead">프로필을 만들고 FOCAL에서 하루를 기록하세요.</p>
        <form class="auth-form" action="#" method="post">
          <div class="profile-picker"><label for="profile-image"><img src="../assets/image.png" alt="프로필 사진 미리보기" /></label><span>사진 변경</span><input class="sr-only" id="profile-image" name="profile-image" type="file" accept="image/*" /></div>
          <div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" placeholder="hello@focal.kr" autocomplete="email" required /></div>
          <div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" placeholder="8자 이상 입력하세요" autocomplete="new-password" required /></div>
          <div class="field"><label for="signup-password-confirm">비밀번호 확인</label><input id="signup-password-confirm" name="password-confirm" type="password" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required /></div>
          <div class="field"><label for="nickname">닉네임</label><input id="nickname" name="nickname" type="text" placeholder="10자 이내로 입력하세요" maxlength="10" required /></div>
          <button class="button wide" type="submit">회원가입</button>
        </form>
        <a class="auth-link" href="login.html">이미 계정이 있으신가요? <strong>로그인</strong></a>
      </section>
    </main>
  </body>
</html>
