<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 — FOCAL</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-page">
    <header class="topbar"><div class="topbar-inner container-inner"><a class="brand" href="index.html">FOCAL<span class="brand-dot">.</span></a></div></header>
    <main class="auth-shell container-inner">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">다시 만나서 반가워요</h1>
        <p class="lead">오늘의 장면을 계속 기록해보세요.</p>
        <form class="auth-form" action="#" method="post">
          <div class="field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" placeholder="hello@focal.kr" autocomplete="email" required /></div>
          <div class="field"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required /></div>
          <button class="button wide" type="submit">로그인</button>
        </form>
        <a class="auth-link" href="signup.html">아직 계정이 없으신가요? <strong>회원가입</strong></a>
      </section>
    </main>
  </body>
</html>
